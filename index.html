<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Por qué el Banco de la República sube las tasas de interés?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  #mainCanvas {
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16/9;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    cursor: pointer;
  }
  #controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }
  .ctrl-btn {
    background: #1e1e2e;
    color: #fff;
    border: 1px solid #333;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .ctrl-btn:hover { background: #2d2d4e; border-color: #FFD700; color: #FFD700; }
  #sceneInfo {
    color: #aaa;
    font-size: 13px;
    min-width: 200px;
    text-align: center;
  }
  #progressBar {
    width: 100%;
    max-width: 1280px;
    height: 4px;
    background: #222;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    background: linear-gradient(90deg, #FFD700, #FF6B35);
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
</style>
</head>
<body>
<canvas id="mainCanvas" width="1280" height="720"></canvas>
<div id="progressBar"><div id="progressFill"></div></div>
<div id="controls">
  <button class="ctrl-btn" id="btnPrev">◀ Anterior</button>
  <button class="ctrl-btn" id="btnPlayPause">⏸ Pausar</button>
  <button class="ctrl-btn" id="btnNext">Siguiente ▶</button>
  <span id="sceneInfo">Escena 1 / 7</span>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = 1280, H = 720;

// ─── GLOBAL STATE ───────────────────────────────────────────────────────────
let currentScene = 0;
let sceneTime = 0;
let lastTime = 0;
let paused = false;
let animFrame;
const SCENES = 7;
const SCENE_DURATION = [12, 14, 13, 16, 15, 13, 14]; // seconds per scene

// ─── UTILITY FUNCTIONS ──────────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * Math.min(1, Math.max(0, t)); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function fadeAlpha(t, fadeIn=0.5, fadeOut=0.5, total=1) {
  if (t < fadeIn) return easeOut(t / fadeIn);
  if (t > total - fadeOut) return easeOut((total - t) / fadeOut);
  return 1;
}

// ─── DRAWING HELPERS ────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawText(text, x, y, size, color, align='center', weight='bold', shadow=true) {
  ctx.save();
  ctx.font = `${weight} ${size}px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSubtitle(text, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(W/2 - 500, H - 90, 1000, 60, 12, 'rgba(0,0,0,0.75)');
  drawText(text, W/2, H - 60, 22, '#FFFFFF', 'center', '600', false);
  ctx.restore();
}

function drawSceneTitle(title, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  roundRect(W/2 - 400, 20, 800, 56, 10, 'rgba(0,0,0,0.6)');
  drawText(title, W/2, 48, 20, '#FFD700', 'center', '700', false);
  ctx.restore();
}

function drawPauseIndicator(label='⏸ PAUSA PARA DOBLAJE', alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha * 0.9;
  roundRect(W/2 - 220, H/2 - 35, 440, 70, 14, 'rgba(255,215,0,0.15)', '#FFD700');
  drawText(label, W/2, H/2, 22, '#FFD700', 'center', '700', false);
  ctx.restore();
}

// ─── BACKGROUND GRADIENTS ───────────────────────────────────────────────────
function bgGradient(c1, c2, vertical=true) {
  const g = vertical
    ? ctx.createLinearGradient(0, 0, 0, H)
    : ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ─── CARTOON CHARACTERS ─────────────────────────────────────────────────────
function drawPerson(x, y, scale=1, skinColor='#F4A460', shirtColor='#E74C3C', expression='normal', hairColor='#3D1C02') {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Shadow
  ctx.beginPath();
  ctx.ellipse(0, 85, 30, 8, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();
  // Legs
  roundRect(-18, 55, 14, 35, 4, '#2C3E50');
  roundRect(4, 55, 14, 35, 4, '#2C3E50');
  // Shoes
  roundRect(-22, 85, 18, 10, 4, '#1a1a1a');
  roundRect(4, 85, 18, 10, 4, '#1a1a1a');
  // Body
  roundRect(-22, 15, 44, 45, 8, shirtColor);
  // Arms
  roundRect(-36, 18, 16, 30, 6, shirtColor);
  roundRect(20, 18, 16, 30, 6, shirtColor);
  // Hands
  ctx.beginPath();
  ctx.arc(-28, 50, 8, 0, Math.PI*2);
  ctx.fillStyle = skinColor;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(28, 50, 8, 0, Math.PI*2);
  ctx.fillStyle = skinColor;
  ctx.fill();
  // Neck
  roundRect(-8, 8, 16, 12, 4, skinColor);
  // Head
  ctx.beginPath();
  ctx.ellipse(0, -12, 22, 24, 0, 0, Math.PI*2);
  ctx.fillStyle = skinColor;
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Hair
  ctx.beginPath();
  ctx.ellipse(0, -28, 22, 12, 0, Math.PI, Math.PI*2);
  ctx.fillStyle = hairColor;
  ctx.fill();
  // Eyes
  if (expression === 'surprised') {
    ctx.beginPath(); ctx.arc(-9, -14, 5, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill();
    ctx.beginPath(); ctx.arc(9, -14, 5, 0, Math.PI*2); ctx.fillStyle='white'; ctx.fill();
    ctx.beginPath(); ctx.arc(-9, -14, 3, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(9, -14, 3, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    // Mouth open
    ctx.beginPath(); ctx.arc(0, -2, 7, 0, Math.PI); ctx.fillStyle='#8B0000'; ctx.fill();
  } else if (expression === 'happy') {
    ctx.beginPath(); ctx.arc(-9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, -4, 8, 0, Math.PI); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke();
  } else if (expression === 'worried') {
    ctx.beginPath(); ctx.arc(-9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, -2, 8, Math.PI, 0); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke();
    // Sweat drop
    ctx.beginPath(); ctx.arc(18, -20, 4, 0, Math.PI*2); ctx.fillStyle='#87CEEB'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(-9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.arc(9, -14, 4, 0, Math.PI*2); ctx.fillStyle='#333'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(6, -3); ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.restore();
}

function drawBancoCharacter(x, y, scale=1, t=0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // Building body as character
  // Base building
  roundRect(-50, -20, 100, 120, 6, '#C8A96E');
  // Columns
  for (let i = -35; i <= 35; i += 17) {
    roundRect(i-4, -10, 8, 100, 3, '#B8956A');
  }
  // Roof
  ctx.beginPath();
  ctx.moveTo(-60, -20);
  ctx.lineTo(0, -70);
  ctx.lineTo(60, -20);
  ctx.closePath();
  ctx.fillStyle = '#8B6914';
  ctx.fill();
  // Face on building
  // Eyes (windows)
  const eyeBlink = Math.sin(t * 0.5) > 0.95 ? 2 : 10;
  roundRect(-30, 20, 20, eyeBlink, 4, '#1a3a5c');
  roundRect(10, 20, 20, eyeBlink, 4, '#1a3a5c');
  // Mouth
  ctx.beginPath();
  ctx.arc(0, 55, 15, 0, Math.PI);
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Hat (top hat)
  roundRect(-25, -90, 50, 25, 4, '#1a1a2e');
  roundRect(-35, -68, 70, 8, 2, '#1a1a2e');
  // Arms
  ctx.save();
  ctx.translate(-50, 40);
  ctx.rotate(Math.sin(t*0.8)*0.1 - 0.3);
  roundRect(-8, 0, 16, 40, 6, '#C8A96E');
  ctx.restore();
  ctx.save();
  ctx.translate(50, 40);
  ctx.rotate(Math.sin(t*0.8)*0.1 + 0.3);
  roundRect(-8, 0, 16, 40, 6, '#C8A96E');
  ctx.restore();
  // Shadow
  ctx.beginPath();
  ctx.ellipse(0, 105, 55, 12, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fill();
  ctx.restore();
}

// ─── SCENE RENDERERS ────────────────────────────────────────────────────────

// SCENE 1: INTRO - Supermercado colombiano
function renderScene1(t) {
  const dur = SCENE_DURATION[0];
  // Sky blue background
  bgGradient('#87CEEB', '#E0F4FF');
  
  // Floor
  ctx.fillStyle = '#D4C5A9';
  ctx.fillRect(0, H*0.72, W, H*0.28);
  
  // Supermarket building
  roundRect(100, 200, 700, 380, 0, '#F5F0E8');
  roundRect(100, 200, 700, 60, 0, '#E74C3C');
  
  // Store sign
  roundRect(200, 210, 500, 40, 6, '#C0392B');
  drawText('SUPERMERCADO LA ESPERANZA', W/2 - 150, 230, 20, '#FFFFFF', 'center', '700', false);
  
  // Windows
  for (let i = 0; i < 3; i++) {
    roundRect(150 + i*200, 290, 120, 100, 4, '#AED6F1', '#85C1E9');
    // Shelves inside
    for (let j = 0; j < 3; j++) {
      ctx.fillStyle = '#7F8C8D';
      ctx.fillRect(155 + i*200, 320 + j*22, 110, 3);
      // Products
      for (let k = 0; k < 5; k++) {
        const colors = ['#E74C3C','#F39C12','#27AE60','#8E44AD','#2980B9'];
        roundRect(158 + i*200 + k*20, 308 + j*22, 14, 14, 2, colors[k]);
      }
    }
  }
  
  // Door
  roundRect(350, 400, 100, 180, 4, '#AED6F1', '#85C1E9');
  ctx.fillStyle = '#5D6D7E';
  ctx.fillRect(395, 480, 10, 10);
  
  // Price tags flying/changing
  const pricePhase = (t % 3) / 3;
  const prices = [
    { label: 'Café ☕', old: '$3.200', new: '$4.800', x: 820, y: 250 },
    { label: 'Arroz 🌾', old: '$2.500', new: '$3.900', x: 1050, y: 320 },
    { label: 'Leche 🥛', old: '$1.800', new: '$2.700', x: 820, y: 420 },
    { label: 'Pan 🍞', old: '$1.200', new: '$1.900', x: 1050, y: 480 },
  ];
  
  prices.forEach((p, i) => {
    const delay = i * 0.25;
    const localT = clamp((t - delay * 3) / 2, 0, 1);
    const bounce = Math.sin(t * 2 + i) * 3;
    
    ctx.save();
    ctx.globalAlpha = clamp(localT * 2, 0, 1);
    roundRect(p.x - 70, p.y + bounce - 40, 140, 80, 10, '#FFFFFF', '#E74C3C');
    drawText(p.label, p.x, p.y + bounce - 20, 16, '#2C3E50', 'center', '600', false);
    // Old price crossed out
    ctx.save();
    ctx.globalAlpha *= 0.5;
    drawText(p.old, p.x, p.y + bounce + 2, 14, '#E74C3C', 'center', '400', false);
    ctx.beginPath();
    ctx.moveTo(p.x - 25, p.y + bounce + 2);
    ctx.lineTo(p.x + 25, p.y + bounce + 2);
    ctx.strokeStyle = '#E74C3C';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    // New price
    drawText(p.new, p.x, p.y + bounce + 22, 18, '#E74C3C', 'center', '800', false);
    // Up arrow
    ctx.font = 'bold 20px Arial';
    ctx.fillStyle = '#E74C3C';
    ctx.textAlign = 'center';
    ctx.fillText('↑', p.x + 55, p.y + bounce - 10);
    ctx.restore();
  });
  
  // People looking surprised
  const personBob = Math.sin(t * 1.5) * 3;
  drawPerson(300, 500 + personBob, 0.9, '#F4A460', '#3498DB', 'surprised');
  drawPerson(500, 495 + personBob * 0.7, 0.85, '#8D5524', '#27AE60', 'surprised');
  drawPerson(650, 502 + personBob * 1.2, 0.88, '#FDBCB4', '#9B59B6', 'worried');
  
  // Exclamation marks
  if (t > 2) {
    const excAlpha = clamp((t - 2) * 0.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = excAlpha;
    drawText('!', 340, 390, 40, '#E74C3C', 'center', '900');
    drawText('!', 540, 385, 40, '#E74C3C', 'center', '900');
    drawText('?!', 690, 392, 36, '#E74C3C', 'center', '900');
    ctx.restore();
  }
  
  // Main title
  const titleAlpha = t < 1 ? easeOut(t) : t > dur - 2 ? easeOut(dur - t) : 1;
  ctx.save();
  ctx.globalAlpha = titleAlpha;
  roundRect(W/2 - 480, H/2 - 60, 960, 120, 16, 'rgba(0,0,0,0.75)');
  drawText('¿Por qué todo está más caro?', W/2, H/2 - 15, 46, '#FFD700', 'center', '900');
  drawText('La inflación en Colombia', W/2, H/2 + 35, 26, '#FFFFFF', 'center', '400');
  ctx.restore();
  
  // Pause indicator at t=8
  if (t > 7 && t < 11) {
    const pAlpha = Math.sin((t - 7) * Math.PI / 4) * 0.8;
    drawPauseIndicator('⏸ PAUSA — Describe lo que ves en el supermercado', Math.max(0, pAlpha));
  }
  
  drawSceneTitle('ESCENA 1 — INTRO: El Supermercado Colombiano', titleAlpha);
  drawSubtitle('Los precios en Colombia están subiendo constantemente...', titleAlpha);
}

// SCENE 2: QUÉ ES LA INFLACIÓN
function renderScene2(t) {
  const dur = SCENE_DURATION[1];
  bgGradient('#FFF3E0', '#FFE0B2');
  
  // Title
  const titleAlpha = t < 1 ? easeOut(t) : 1;
  drawSceneTitle('ESCENA 2 — ¿Qué es la Inflación?', titleAlpha);
  
  // Central concept
  if (t < 6) {
    // Phase 1: Show money circulating
    const phase = clamp(t / 3, 0, 1);
    
    // Big circle representing economy
    ctx.save();
    ctx.globalAlpha = phase;
    ctx.beginPath();
    ctx.arc(W/2, H/2, 200, 0, Math.PI*2);
    ctx.strokeStyle = '#FF6B35';
    ctx.lineWidth = 4;
    ctx.setLineDash([20, 10]);
    ctx.lineDashOffset = -t * 30;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    
    // Floating bills
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 + t * 0.5;
      const r = 150 + Math.sin(t + i) * 20;
      const bx = W/2 + Math.cos(angle) * r;
      const by = H/2 + Math.sin(angle) * r;
      ctx.save();
      ctx.globalAlpha = phase * 0.9;
      ctx.translate(bx, by);
      ctx.rotate(angle + Math.PI/2);
      roundRect(-18, -10, 36, 20, 3, '#27AE60', '#1E8449');
      drawText('$', 0, 0, 12, '#FFFFFF', 'center', '700', false);
      ctx.restore();
    }
    
    // Center label
    ctx.save();
    ctx.globalAlpha = phase;
    roundRect(W/2 - 120, H/2 - 35, 240, 70, 12, '#FF6B35');
    drawText('MUCHO DINERO', W/2, H/2 - 8, 22, '#FFFFFF', 'center', '800', false);
    drawText('circulando', W/2, H/2 + 18, 16, '#FFFFFF', 'center', '400', false);
    ctx.restore();
    
    // Products with rising prices
    const products = [
      { emoji: '🫓', name: 'Empanadas', price: '+35%', x: 200, y: 200 },
      { emoji: '⛽', name: 'Gasolina', price: '+28%', x: 1050, y: 200 },
      { emoji: '🚌', name: 'Transporte', price: '+22%', x: 200, y: 520 },
      { emoji: '🛒', name: 'Mercado', price: '+40%', x: 1050, y: 520 },
    ];
    
    products.forEach((p, i) => {
      const delay = i * 0.5;
      const pAlpha = clamp((t - delay) * 0.8, 0, 1);
      const bounce = Math.sin(t * 1.5 + i) * 5;
      ctx.save();
      ctx.globalAlpha = pAlpha;
      roundRect(p.x - 70, p.y + bounce - 50, 140, 100, 12, '#FFFFFF', '#FF6B35');
      ctx.font = '32px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(p.emoji, p.x, p.y + bounce - 20);
      drawText(p.name, p.x, p.y + bounce + 10, 14, '#2C3E50', 'center', '600', false);
      drawText(p.price, p.x, p.y + bounce + 32, 20, '#E74C3C', 'center', '800', false);
      ctx.restore();
    });
  } else {
    // Phase 2: Infographic explanation
    const phase2 = clamp((t - 6) / 2, 0, 1);
    
    bgGradient('#1a1a2e', '#16213e');
    
    // Arrow diagram
    const steps = [
      { label: 'Mucha demanda', icon: '👥', color: '#E74C3C' },
      { label: 'Poco inventario', icon: '📦', color: '#F39C12' },
      { label: 'Precios suben', icon: '📈', color: '#E74C3C' },
      { label: 'Inflación', icon: '💸', color: '#FF6B35' },
    ];
    
    steps.forEach((s, i) => {
      const delay = i * 0.3;
      const sAlpha = clamp((phase2 - delay) * 3, 0, 1);
      const sx = 160 + i * 280;
      const sy = H/2;
      
      ctx.save();
      ctx.globalAlpha = sAlpha;
      // Circle
      ctx.beginPath();
      ctx.arc(sx, sy, 70, 0, Math.PI*2);
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx, sy, 70, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 3;
      ctx.stroke();
      // Emoji
      ctx.font = '36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(s.icon, sx, sy - 10);
      drawText(s.label, sx, sy + 35, 15, '#FFFFFF', 'center', '600', false);
      // Arrow
      if (i < steps.length - 1) {
        ctx.beginPath();
        ctx.moveTo(sx + 75, sy);
        ctx.lineTo(sx + 195, sy);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 4;
        ctx.stroke();
        // Arrowhead
        ctx.beginPath();
        ctx.moveTo(sx + 195, sy - 10);
        ctx.lineTo(sx + 215, sy);
        ctx.lineTo(sx + 195, sy + 10);
        ctx.fillStyle = '#FFD700';
        ctx.fill();
      }
      ctx.restore();
    });
    
    // Definition box
    const defAlpha = clamp((phase2 - 0.8) * 2, 0, 1);
    ctx.save();
    ctx.globalAlpha = defAlpha;
    roundRect(W/2 - 450, H - 180, 900, 80, 12, 'rgba(255,107,53,0.2)', '#FF6B35');
    drawText('La inflación ocurre cuando los precios suben constantemente', W/2, H - 150, 22, '#FFFFFF', 'center', '600', false);
    drawText('y el poder adquisitivo del dinero disminuye', W/2, H - 120, 18, '#FFD700', 'center', '400', false);
    ctx.restore();
  }
  
  // Pause at t=10
  if (t > 9 && t < 13) {
    const pAlpha = Math.sin((t - 9) * Math.PI / 4) * 0.8;
    drawPauseIndicator('⏸ PAUSA — Explica qué es la inflación', Math.max(0, pAlpha));
  }
  
  drawSubtitle('La inflación: cuando los precios suben y el dinero vale menos', titleAlpha);
}

// SCENE 3: EL BANCO DE LA REPÚBLICA
function renderScene3(t) {
  const dur = SCENE_DURATION[2];
  bgGradient('#1a3a5c', '#0d2137');
  
  // Stars/particles
  for (let i = 0; i < 30; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 97.3) % (H * 0.6);
    const pulse = 0.5 + Math.sin(t * 2 + i) * 0.3;
    ctx.beginPath();
    ctx.arc(sx, sy, 2, 0, Math.PI*2);

  ctx.lineTo(buildingX + 220, buildingY - 280);

  for (let row = 0; row < 3; row++) {

  // Banco character (animated)
  if (t > 2) {

    ctx.globalAlpha = charAlpha;

      ctx.globalAlpha = bubbleAlpha;

      ctx.lineTo(240, 440);
      ctx.lineTo(310, 410);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      drawText('Detectando...', 470, 360, 18, '#2C3E50', 'center', '600', false);

      drawText('⚠️ ¡Por encima del objetivo!', 470, 418, 16, '#F39C12', 'center', '600', false);
      ctx.restore();
    }
  }
  
  // Monitoring screens
  if (t > 1) {
    const screenAlpha = clamp((t - 1) * 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = screenAlpha;
    
    // Screen 1
    roundRect(900, 200, 300, 200, 8, '#0a0a1a', '#00FF88');

    // Mini chart
    const chartData = [30, 45, 40, 55, 70, 85, 95];
    ctx.beginPath();
    ctx.moveTo(920, 380);
    chartData.forEach((v, i) => {
      ctx.lineTo(920 + i * 38, 380 - v * 1.2);

    ctx.strokeStyle = '#E74C3C';
    ctx.lineWidth = 3;
    ctx.stroke();
    drawText('↑ Subiendo', 1050, 370, 16, '#E74C3C', 'center', '700', false);

  const titleAlpha = t < 1 ? easeOut(t) : 1;
  drawSceneTitle('ESCENA 3 — El Banco de la República', titleAlpha);
  
  // Pause

    drawPauseIndicator('⏸ PAUSA — Explica el rol del Banco de la República', Math.max(0, pAlpha));

}

}

    ctx.globalAlpha = textAlpha;
    roundRect(W/2 - 480, 120, 960, 130, 16, 'rgba(0,0,0,0.7)');
    drawText('El objetivo es evitar que los precios', W/2, 158, 32, '#FFD700', 'center', '900');
    drawText('suban sin control', W/2, 200, 36, '#FFD700', 'center', '900');
    ctx.restore();
  }
  
  // Stabilization indicators
  if (t > 5) {
    const indAlpha = clamp((t - 5) * 0.5, 0, 1);
    const indicators = [
      { icon: '📊', text: 'Inflación controlada', color: '#27AE60' },
      { icon: '💰', text: 'Precios estables', color: '#3498DB' },
      { icon: '😊', text: 'Familias tranquilas', color: '#F39C12' },
    ];
    indicators.forEach((ind, i) => {
      const ix = 250 + i * 380;
      ctx.save();
      ctx.globalAlpha = indAlpha * clamp((t - 5 - i*0.3) * 2, 0, 1);
      roundRect(ix - 120, 290, 240, 80, 12, 'rgba(255,255,255,0.1)', ind.color);
      ctx.font = '28px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(ind.icon, ix, 325);
      drawText(ind.text, ix, 352, 16, '#FFFFFF', 'center', '600', false);
      ctx.restore();
    });
  }
  
  // Credits
  if (t > 10) {
    const credAlpha = clamp((t - 10) * 0.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = credAlpha;
    roundRect(W/2 - 300, H - 120, 600, 60, 10, 'rgba(0,0,0,0.6)');
    drawText('Banco de la República de Colombia', W/2, H - 98, 16, '#FFD700', 'center', '600', false);
    drawText('Educación Económica para Todos 🇨🇴', W/2, H - 75, 14, '#FFFFFF', 'center', '400', false);
    ctx.restore();
  }
  
  const titleAlpha = t < 1 ? easeOut(t) : 1;
  drawSceneTitle('ESCENA 7 — Conclusión', titleAlpha);
  
  if (t > 8 && t < 13) {
    const pAlpha = Math.sin((t - 8) * Math.PI / 4) * 0.8;
    drawPauseIndicator('⏸ PAUSA FINAL — Conclusión y mensaje final', Math.max(0, pAlpha));
  }
  
  drawSubtitle('El Banco de la República: guardián de la estabilidad económica de Colombia 🇨🇴', titleAlpha);
}

// ─── TRANSITION OVERLAY ─────────────────────────────────────────────────────
function drawTransition(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ─── MAIN RENDER LOOP ───────────────────────────────────────────────────────
const sceneRenderers = [
  renderScene1, renderScene2, renderScene3, renderScene4,
  renderScene5, renderScene6, renderScene7
];

function render(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  
  if (!paused) {
    sceneTime += delta;
    const dur = SCENE_DURATION[currentScene];
    if (sceneTime >= dur) {
      if (currentScene < SCENES - 1) {
        currentScene++;
        sceneTime = 0;
      } else {
        sceneTime = dur; // Hold last frame
      }
    }
  }
  
  // Clear
  ctx.clearRect(0, 0, W, H);
  
  // Render current scene
  sceneRenderers[currentScene](sceneTime);
  
  // Transition fade at scene boundaries
  const dur = SCENE_DURATION[currentScene];
  const fadeLen = 0.8;
  if (sceneTime < fadeLen) {
    drawTransition(1 - easeOut(sceneTime / fadeLen));
  } else if (sceneTime > dur - fadeLen) {
    drawTransition(easeOut((sceneTime - (dur - fadeLen)) / fadeLen));
  }
  
  // Update UI
  updateUI();
  
  animFrame = requestAnimationFrame(render);
}

function updateUI() {
  const totalDur = SCENE_DURATION.reduce((a, b) => a + b, 0);
  const elapsed = SCENE_DURATION.slice(0, currentScene).reduce((a, b) => a + b, 0) + sceneTime;
  document.getElementById('progressFill').style.width = (elapsed / totalDur * 100) + '%';
  document.getElementById('sceneInfo').textContent = `Escena ${currentScene + 1} / ${SCENES} — ${Math.floor(sceneTime)}s`;
  document.getElementById('btnPlayPause').textContent = paused ? '▶ Reproducir' : '⏸ Pausar';
}

// ─── CONTROLS ───────────────────────────────────────────────────────────────
document.getElementById('btnPlayPause').addEventListener('click', () => {
  paused = !paused;
});

document.getElementById('btnNext').addEventListener('click', () => {
  if (currentScene < SCENES - 1) {
    currentScene++;
    sceneTime = 0;
    lastTime = 0;
  }
});

document.getElementById('btnPrev').addEventListener('click', () => {
  if (currentScene > 0) {
    currentScene--;
    sceneTime = 0;
    lastTime = 0;
  } else {
    sceneTime = 0;
    lastTime = 0;
  }
});

canvas.addEventListener('click', () => {
  paused = !paused;
});

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'k') { paused = !paused; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'l') {
    if (currentScene < SCENES - 1) { currentScene++; sceneTime = 0; lastTime = 0; }
  }
  if (e.key === 'ArrowLeft' || e.key === 'j') {
    if (currentScene > 0) { currentScene--; sceneTime = 0; lastTime = 0; }
    else { sceneTime = 0; lastTime = 0; }
  }
  if (e.key >= '1' && e.key <= '7') {
    currentScene = parseInt(e.key) - 1;
    sceneTime = 0;
    lastTime = 0;
  }
});

// ─── START ──────────────────────────────────────────────────────────────────
requestAnimationFrame(render);
</script>

</html>
